# opencode2dsh DSH plugin — bundle patch: insert the plugin row (deployment-global).
#
# The plugin itself is distributed as the npm package @opencode2dsh/dsh-plugin
# (declared in dependencies); this patch only inserts its loader row.
# Defaults need no edits: the adapter registers into llm-pi-ai with no key and
# no extra process. Override any option via the config object (src/config.ts).
- insert:
    - id: opencode2dsh
      name: '@opencode2dsh/dsh-plugin'
      config: {}
#
# Relay supervisor (this fork's addition, packages/relay).
#
# Since 2026-10-25 the opencode.ai free tier also gates on the TLS handshake:
# a BoringSSL ClientHello (Bun) is accepted, OpenSSL (Node, i.e. DSH) is refused
# with the same `FreeUsageLimitError` no matter what body is sent. So the plugin
# cannot reach the lane from a Node process, and this row supervises a Bun relay
# that can.
#
# It starts and stops with DSH. `port` must match the base URL the plugin talks
# to — run `scripts/point-plugin-at-relay.ps1` once to redirect it, since
# ZEN_BASE_URL is a module constant with no config surface.
#
# `name` is this package's OWN root: its `main`/`exports` point at
# packages/relay/lib/index.mjs. It has to be the root, because a bundle's rows are
# resolved from the profile's node_modules — only the bundle itself is installed
# there, so a nested `packages/relay` package is not reachable by name.
#
# Remove this row to run without the relay (the plugin then behaves exactly as
# upstream 0.3.14 does: 429 on every free model until upstream adapts).
    - id: opencode2dsh-relay
      name: opencode2dsh
      config:
        port: 8899
        autoStart: true
